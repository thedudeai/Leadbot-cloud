<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lead Bot — sign in</title>
<style>
  :root{--bg:#0f1115;--panel:#161a22;--line:#262c38;--ink:#e8ebf1;--dim:#9aa3b5;--accent:#6ea8fe;--bad:#f07178}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  form{width:min(380px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  h1{font-size:18px;margin:0}
  p{color:var(--dim);margin:0 0 18px;font-size:13px}
  label{display:block;font-size:11px;letter-spacing:.06em;color:var(--dim);margin:12px 0 5px;text-transform:uppercase}
  input{width:100%;background:#0f1218;border:1px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:9px;font-size:14px}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;margin-top:18px;background:var(--accent);color:#0b1020;border:0;padding:11px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .err{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}
</style>
</head>
<body>
<form id="f">
  <div class="brand"><span class="dot"></span><h1>Lead Bot</h1></div>
  <p>Sign in with the account your admin set up for you.</p>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" required autofocus />
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" required />
  <button id="go" type="submit">Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
  const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  f.onsubmit = async (e) => {
    e.preventDefault(); go.disabled = true; err.textContent = '';
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.ok) { location.href = '/'; return; }
      err.textContent = j.error || 'Could not sign in.';
    } catch { err.textContent = 'Could not reach the server.'; }
    go.disabled = false;
  };
</script>
</body>
</html>
